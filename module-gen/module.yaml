modules:
  - LUT:
      ports:
        - gen_in:
            message: MLUTGenInput
            kind: fifo
        - activation_in:
            message: LUTActivationInput
            kind: signal
        - accumulation_in:
            message: LUTAccumulationInput
        - lut_out:
            message: LUTGenOutput
      subModules:
        - LUTDispatch
        - LUTGen: NUM_OF_GEN_PER_LUT
        - LUTMem
        - LUTAcc: NUM_OF_ACC_PER_LUT
      csrRegisters:
        - LUTDispatch
        - LUTMem
      connections:
        - LUT.gen_in : LUTGen.gen_in  # bi-directional connection, LUTGen.gen_in is the same as LUT.gen_in
        - LUTGen.gen_out : LUTMem.gen_in
        - LUTMem.mem_out : LUTAcc.mem_in
        - LUTAcc.acc_out : LUT.gen_out
        - source: LUT.activation_in  # single direct connection
          target: LUTAcc.activation_in

  - LUTGen:
      ports:
      - gen_in
      - gen_out

  - LUTMem:
      base: Memory
      parameters:
      - MemorySize: 32
      - MemoryWidth: 10  

  - LUTAcc:
      ports:
      - mem_in
      - acc_out

# builtin modules, mostly used as parent module, supported keys
# - parameters : mapping to C++ template types
# - port : same as Module
# [Note] one built-in should be one single non-submobulde module,
#        in such case, keys subModules and connection is not supported
builtins:
  - Memory:
      parameters:
        - MemorySize: size_t
        - MemoryWidth: size_t
        - MemoryType: MemoryTypeEnum
      port:
        - read_in:
            message: MemoryReadRequest
        - read_out:
            message: MemoryReadResponse
        - write_in:
            message: MemoryWriteRequest
        - write_out:
            message: MemoryWriteResponse

# pre-defined connection message
messages:
  - MemoryReadRequest:
      fields:
        - address: size_t
  - MemoryReadResponse: 
      fields:
        - data: uint8_t
  - MemoryWriteRequest: 
      fields:
        - address: size_t
        - data: uint8_t
  - MemoryWriteResponse: 
      fields:
        - ack: bool

# register in modules, espically for control register
registers:
  - LUTDispatch:
      address: 0x00000003

# helps enum, used in base module parameters
enums:
  - MemoryTypeEnum:
    - None
    - Paged

# helps constant, used in base module parameters
constants:
  - NUM_OF_GEN_PER_LUT: 32  # 4 lines * 8 lut
  - NUM_OF_ACC_PER_LUT: 32  # 4 lines * 8 lut
